<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Bisel exterior del disco -->
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset="0.86" stop-color="#0a5048"/>
      <stop offset="0.94" stop-color="#1d8a7c"/>
      <stop offset="0.985" stop-color="#063830"/>
      <stop offset="1" stop-color="#021a16"/>
    </radialGradient>
    <!-- Fondo interior del disco (depresión) -->
    <radialGradient id="well" cx=".5" cy=".42" r=".58">
      <stop offset="0" stop-color="#0d5a52"/>
      <stop offset="1" stop-color="#063a32"/>
    </radialGradient>
    <!-- Cuerpo de la hoja (verde sage metálico) -->
    <linearGradient id="bladeFill" x1="0" y1="-410" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86c4af"/>
      <stop offset=".5" stop-color="#5fa791"/>
      <stop offset="1" stop-color="#3a7b69"/>
    </linearGradient>
    <linearGradient id="bladeDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa089"/>
      <stop offset="1" stop-color="#356e5d"/>
    </linearGradient>
    <!-- Remache plateado -->
    <radialGradient id="rivet" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#f4f7f8"/>
      <stop offset=".5" stop-color="#a8b3b6"/>
      <stop offset="1" stop-color="#2a3033"/>
    </radialGradient>

    <!-- Una hoja Macintosh: tip arriba (NORTE), conector cerca del centro hacia el ESTE.
         Al rotarla 0°/90°/180°/270° crea el efecto lauburu/molinete horario. -->
    <g id="blade">
      <!-- Cuerpo principal banana N→E -->
      <path d="
        M -28,-410
        L 28,-410
        L 28,-378
        L 10,-378
        L 10,-355
        C 100,-335 240,-260 286,-130
        C 304,-60 264,12 196,46
        L 130,82
        L 92,46
        L 70,18
        C 24,-110 -28,-280 -28,-360
        Z"
        fill="url(#bladeFill)"
        stroke="rgba(0,0,0,.25)" stroke-width="2" stroke-linejoin="round"/>

      <!-- Highlight superior (brillo claro siguiendo el borde) -->
      <path d="
        M -22,-402
        L 22,-402"
        fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="4" stroke-linecap="round"/>
      <path d="
        M -24,-395
        C 5,-310 60,-260 145,-220"
        fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <path d="
        M 20,-370
        C 80,-340 200,-260 250,-140"
        fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Sombra inferior interna (borde oscuro del relieve) -->
      <path d="
        M 10,-348
        C 95,-320 230,-240 275,-115
        C 290,-55 252,5 192,38"
        fill="none" stroke="rgba(0,0,0,.32)" stroke-width="3" stroke-linecap="round"/>

      <!-- Detalle del lip / tip (paso interior de la L característica) -->
      <path d="M 28,-378 L 10,-378 L 10,-365" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="2"/>

      <!-- Conector: ranura del enganche al handle -->
      <path d="
        M 130,82
        L 92,46
        L 70,18"
        fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="
        M 130,82
        L 118,68"
        fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
    </g>
  </defs>

  <!-- Fondo cuadrado redondeado del icono -->
  <rect width="1024" height="1024" rx="184" ry="184" fill="#0a4d45"/>

  <!-- Disco "moneda" con bisel -->
  <circle cx="512" cy="512" r="492" fill="url(#rim)"/>
  <!-- Anillo interior (línea oscura) -->
  <circle cx="512" cy="512" r="460" fill="url(#well)" stroke="rgba(0,0,0,.45)" stroke-width="3"/>

  <!-- 4 hojas en lauburu (molinete horario) -->
  <g transform="translate(512,512)">
    <use href="#blade" transform="rotate(0)"/>
    <use href="#blade" transform="rotate(90)"/>
    <use href="#blade" transform="rotate(180)"/>
    <use href="#blade" transform="rotate(270)"/>

    <!-- 4 remaches plateados (uniones de las hojas cerca del centro) -->
    <g>
      <circle cx="50" cy="-22" r="13" fill="url(#rivet)" stroke="#15191b" stroke-width="1.5"/>
      <circle cx="22" cy="50" r="13" fill="url(#rivet)" stroke="#15191b" stroke-width="1.5"/>
      <circle cx="-50" cy="22" r="13" fill="url(#rivet)" stroke="#15191b" stroke-width="1.5"/>
      <circle cx="-22" cy="-50" r="13" fill="url(#rivet)" stroke="#15191b" stroke-width="1.5"/>
    </g>
  </g>
</svg>
